name: CI/CD Pipeline

on: [push, pull_request, workflow_dispatch]

env:
  HOME_REPO: datakortet/dk-tasklib

jobs:
  ci-lint:
    name: CI:Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flake8
      - run: python -m flake8 dktasklib --max-line-length=199

  ci-test:
    name: CI:Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: dk-tasklib
    steps:
      - uses: actions/checkout@v4
        with:
          path: dk-tasklib
      - uses: actions/checkout@v4
        with:
          repository: datakortet/yamldirs
          path: yamldirs
      - uses: actions/checkout@v4
        with:
          repository: datakortet/dkfileutils
          path: code/dkfileutils
      - uses: actions/checkout@v4
        with:
          repository: datakortet/dkpkg
          path: code/dkpkg
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: dk-tasklib/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -vv --cov=dktasklib tests
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: dk-tasklib
          fail_ci_if_error: false

  ci-docs:
    name: CI:Docs (Sphinx ${{ matrix.sphinx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            sphinx: '8.2.3'
          - python-version: '3.12'
            sphinx: '9.1.0'
    defaults:
      run:
        working-directory: dk-tasklib
    steps:
      - uses: actions/checkout@v4
        with:
          path: dk-tasklib
      - uses: actions/checkout@v4
        with:
          repository: datakortet/yamldirs
          path: yamldirs
      - uses: actions/checkout@v4
        with:
          repository: datakortet/dkfileutils
          path: code/dkfileutils
      - uses: actions/checkout@v4
        with:
          repository: datakortet/dkpkg
          path: code/dkpkg
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: dk-tasklib/requirements.txt
      - run: python -m pip install -r requirements.txt Sphinx==${{ matrix.sphinx }}
      - run: python -m sphinx -E -W -b html docs build/docs

  cd:
    name: CD
    needs: [ci-lint, ci-test, ci-docs]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dk-tasklib
    steps:
      - uses: actions/checkout@v4
        with:
          path: dk-tasklib
      - uses: actions/checkout@v4
        with:
          repository: datakortet/yamldirs
          path: yamldirs
      - uses: actions/checkout@v4
        with:
          repository: datakortet/dkfileutils
          path: code/dkfileutils
      - uses: actions/checkout@v4
        with:
          repository: datakortet/dkpkg
          path: code/dkpkg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dk-tasklib/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python setup.py sdist bdist_wheel
      - name: Upload packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: dk-tasklib/dist/
      - name: Deploy to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == env.HOME_REPO
        run: twine upload -u __token__ -p ${{ secrets.PYPI_API_TOKEN }} dist/*
      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == env.HOME_REPO
        with:
          artifacts: dk-tasklib/dist/*
          owner: datakortet
          repo: dk-tasklib
          token: ${{ secrets.GITHUB_TOKEN }}
